[package]
name = "modurl"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
authors.workspace = true
description = "Modular reinforcement learning algorithms and utilities built on Candle"
license = "MIT"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/modurl"
readme = "README.md"
keywords = ["reinforcement-learning", "machine-learning", "candle", "rl"]
categories = ["artificial-intelligence", "science", "algorithms"]

[workspace]
members = [
    ".",
    "crates/modurl_gym",
    "crates/modurl_ale",
    "crates/modurl_logger",
    "crates/modurl_mujoco",
    "crates/examples",
    "crates/benches",
]
resolver = "3"

[workspace.package]
rust-version = "1.88"
authors = ["Ethan Almloff"]
repository = "https://github.com/ModuRL/ModuRL"
homepage = "https://modurl.github.io/ModuRL/"

[dependencies]
bon = "3.7.2"
candle-core = "0.11.0"
candle-nn = "0.11.0"
rand = "0.10.2"
tracing = { version = "0.1.37", optional = true }
thiserror = "2.0.20"

[features]
default = []
multithreading = []
tracing = ["dep:tracing"]

[patch.crates-io]
glutin = { git = "https://github.com/davidhozic/glutin", rev = "e95fe97f1857c0498ed2236c0e8d60e5a30a2854" }

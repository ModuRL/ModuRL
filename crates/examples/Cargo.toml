[package]
name = "examples"
version = "0.0.0"
edition = "2024"
publish = false

[[example]]
name = "ppo_mujoco"
path = "examples/ppo_mujoco.rs"
required-features = ["mujoco-environment"]

[[example]]
name = "a2c_mujoco"
path = "examples/a2c_mujoco.rs"
required-features = ["mujoco-environment"]

[[example]]
name = "sac_mujoco"
path = "examples/sac_mujoco.rs"
required-features = ["mujoco-environment"]

[[example]]
name = "ddpg_mujoco"
path = "examples/ddpg_mujoco.rs"
required-features = ["mujoco-environment"]

[[example]]
name = "td3_mujoco"
path = "examples/td3_mujoco.rs"
required-features = ["mujoco-environment"]

[dependencies]
modurl = { version = "0.1.0", path = "../.." }
modurl_gym = { version = "0.1.0", path = "../modurl_gym", features = [
    "rendering",
] }
modurl_logger = { version = "0.1.0", path = "../modurl_logger" }
modurl_mojoco = { version = "0.1.0", path = "../modurl_mojoco" }
candle-core = "0.11.0"
candle-nn = "0.11.0"

[features]
default = []
ant = ["mujoco-environment"]
half-cheetah = ["mujoco-environment"]
hopper = ["mujoco-environment"]
humanoid = ["mujoco-environment"]
mujoco-environment = []
sumo-ants = ["mujoco-environment"]
walker2d = ["mujoco-environment"]
cuda = [
    "modurl/cuda",
    "modurl_gym/cuda",
    "modurl_mojoco/cuda",
    "candle-core/cuda",
]
cudnn = [
    "modurl/cudnn",
    "modurl_gym/cudnn",
    "modurl_mojoco/cudnn",
    "candle-core/cudnn",
]
metal = [
    "modurl/metal",
    "modurl_gym/metal",
    "modurl_mojoco/metal",
    "candle-core/metal",
]
multithreading = ["modurl/multithreading"]
mkl = ["modurl/mkl", "modurl_gym/mkl", "modurl_mojoco/mkl", "candle-core/mkl"]
rendering = ["modurl_gym/rendering", "modurl_mojoco/rendering"]

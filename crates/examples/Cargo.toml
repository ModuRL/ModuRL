[package]
name = "examples"
version = "0.0.0"
edition = "2024"
publish = false

[[example]]
name = "ppo_mujoco"
path = "examples/ppo_mujoco.rs"
required-features = ["mujoco-environment"]

[[example]]
name = "a2c_mujoco"
path = "examples/a2c_mujoco.rs"
required-features = ["mujoco-environment"]

[[example]]
name = "sac_mujoco"
path = "examples/sac_mujoco.rs"
required-features = ["mujoco-environment"]

[[example]]
name = "ddpg_mujoco"
path = "examples/ddpg_mujoco.rs"
required-features = ["mujoco-environment"]

[[example]]
name = "td3_mujoco"
path = "examples/td3_mujoco.rs"
required-features = ["mujoco-environment"]

[[example]]
name = "rendered_lunar_lander_ppo"
path = "examples/rendered_lunar_lander_ppo.rs"
required-features = ["rendering"]

[dependencies]
modurl = { version = "0.1.0", path = "../.." }
modurl_gym = { version = "0.1.0", path = "../modurl_gym" }
modurl_logger = { version = "0.1.0", path = "../modurl_logger" }
modurl_mojoco = { version = "0.1.0", path = "../modurl_mojoco" }
candle-core = "0.11.0"
candle-nn = "0.11.0"

[features]
default = []
ant = ["mujoco-environment"]
half-cheetah = ["mujoco-environment"]
hopper = ["mujoco-environment"]
mujoco-environment = []
walker2d = ["mujoco-environment"]
cuda = ["candle-core/cuda"]
metal = ["candle-core/metal"]
multithreading = ["modurl/multithreading"]
rendering = ["modurl_gym/rendering", "modurl_mojoco/rendering"]

[package]
name = "modurl-benches"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false

[[bin]]
name = "modurl-benches"
path = "src/main.rs"

[dependencies]
burn = { version = "=0.22.0", default-features = false, features = ["std", "flex", "autodiff", "optim"] }
burn-cubecl = { version = "=0.22.0", default-features = false, features = ["fusion"], optional = true }
modurl = { path = "../..", features = ["multithreading"] }
modurl_ale = { path = "../modurl_ale" }
rayon = "1.12.0"
serde_json = "1.0"
tch = { version = "=0.22.0", optional = true }
tracing = { version = "0.1.37", optional = true }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"], optional = true }

[features]
default = []
cuda = ["burn/cuda", "dep:burn-cubecl", "burn-cubecl/autotune"]
libtorch = ["burn/tch", "dep:tch"]
metal = ["burn/metal", "dep:burn-cubecl"]
rendering = ["modurl_ale/rendering"]
tracing = ["modurl/tracing", "dep:tracing", "dep:tracing-subscriber"]

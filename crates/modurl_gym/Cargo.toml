[package]
name = "modurl_gym"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
authors.workspace = true
description = "Gymnasium-compatible classic-control and Box2D environments for ModuRL"
license = "MIT"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/modurl_gym"
readme = "README.md"
keywords = ["reinforcement", "gymnasium", "environments", "simulation"]
categories = ["artificial-intelligence", "science", "simulation"]

[dependencies]
modurl = { version = "0.1.0", path = "../.." }
candle-core = "0.11.0"
log = { version = "0.4.28", optional = true }
box2d-rs = "0.0.4"
minifb = { version = "0.28.0", optional = true }
bon = "3.7.2"
thiserror = "2.0.20"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
logging = ["dep:log"]
rendering = ["dep:minifb"]

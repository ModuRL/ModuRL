[package]
name = "modurl_ale"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
authors.workspace = true
description = "Arcade Learning Environment environments for ModuRL"
license = "GPL-2.0-only"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/modurl_ale"
readme = "README.md"
keywords = ["reinforcement-learning", "atari", "ale"]
categories = ["artificial-intelligence", "science", "simulation", "emulators"]
build = "build.rs"
include = [
    "/src/**",
    "/tests/**",
    "/native/ale/CMakeLists.txt",
    "/native/ale/cmake/**",
    "/native/ale/ale_py/ale_c_wrapper.cpp",
    "/native/ale/ale_py/ale_c_wrapper.h",
    "/native/ale/src/**",
    "/native/ale/License.txt",
    "/native/ale/Copyright.txt",
    "/build.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_LICENSES.md",
]

[dependencies]
bon = "3.7.2"
candle-core = "0.11.0"
minifb = { version = "0.28.0", optional = true }
modurl = { version = "0.1.0", path = "../.." }

[build-dependencies]
cmake = "0.1"

[features]
default = []
rendering = ["dep:minifb"]

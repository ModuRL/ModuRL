[package]
name = "modurl_mujoco"
version = "0.1.0"
edition = "2024"
build = "build.rs"
rust-version.workspace = true
authors.workspace = true
description = "Gymnasium-compatible MuJoCo environments for ModuRL"
license = "MIT"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/modurl_mujoco"
readme = "README.md"
keywords = ["reinforcement", "mujoco", "gymnasium", "simulation"]
categories = ["artificial-intelligence", "science", "science::robotics", "simulation"]

[dependencies]
modurl = { version = "0.1.0", path = "../.." }
bon = "3.7.2"
burn = { version = "=0.22.0", default-features = false, features = ["std", "flex"] }
rand = "0.10.2"
rand_distr = "0.6.0"
thiserror = "2.0.20"

[target.'cfg(not(target_os = "macos"))'.dependencies]
mujoco-rs = { version = "5.0.0", features = ["auto-download-mujoco"] }

[target.'cfg(target_os = "macos")'.dependencies]
mujoco-rs = "5.0.0"

# A build dependency guarantees mujoco-rs's downloader finishes before this
# package's build script places the runtime DLL beside Windows executables.
[target.'cfg(not(target_os = "macos"))'.build-dependencies]
mujoco-rs = { version = "5.0.0", features = ["auto-download-mujoco"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
mujoco-rs = "5.0.0"

[dev-dependencies]
burn = { version = "=0.22.0", default-features = false, features = ["std", "flex", "autodiff", "optim"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
rendering = ["mujoco-rs/viewer"]

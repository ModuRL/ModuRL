name: Deploy versioned book

on:
  push:
    branches:
      - master
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    paths:
      - ".github/workflows/book-pages.yml"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  MDBOOK_VERSION: "0.5.4"
  MDBOOK_SHA256: "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7"

jobs:
  build:
    name: Build book
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Always build /dev from master. Full history supplies every release
          # tag used to reconstruct the immutable major/minor documentation.
          ref: master
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install mdBook
        shell: bash
        run: |
          archive="$RUNNER_TEMP/mdbook.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$archive" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "$MDBOOK_SHA256" "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/mdbook" --version

      - name: Build development and released books
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _site/dev
          mdbook build docs --dest-dir "$GITHUB_WORKSPACE/_site/dev"

          latest_series=""
          declare -A built_series=()
          series_order=()

          while IFS= read -r tag; do
            version="${tag#v}"
            IFS=. read -r major minor patch <<< "$version"
            series="$major.$minor"

            # The newest patch tag supplies the docs for each major/minor line.
            if [[ -n "${built_series[$series]+present}" ]]; then
              continue
            fi

            worktree="$RUNNER_TEMP/modurl-docs-$series"
            git worktree add --detach "$worktree" "$tag"

            if [[ ! -f "$worktree/docs/book.toml" ]]; then
              echo "Skipping $tag because it does not contain an mdBook"
              git worktree remove --force "$worktree"
              continue
            fi

            # Release tags retain the source configuration they were created
            # with, so set the canonical URL for this versioned build.
            sed -i \
              "s|^site-url = .*|site-url = \"/ModuRL/$series/\"|" \
              "$worktree/docs/book.toml"
            mdbook build "$worktree/docs" \
              --dest-dir "$GITHUB_WORKSPACE/_site/$series"
            git worktree remove --force "$worktree"

            built_series[$series]=1
            series_order+=("$series")
            if [[ -z "$latest_series" ]]; then
              latest_series="$series"
            fi
          done < <(
            git tag --list --sort=-version:refname |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true
          )

          cp docs/site/index.html _site/index.html
          if [[ -n "$latest_series" ]]; then
            sed -i \
              -e "s|\./dev/|./$latest_series/|g" \
              -e "s|development version|latest stable version ($latest_series)|g" \
              _site/index.html
          else
            latest_series="dev"
          fi

          {
            printf '{"latest":"%s","versions":["dev"' "$latest_series"
            for series in "${series_order[@]}"; do
              printf ',"%s"' "$series"
            done
            printf ']}\n'
          } > _site/versions.json
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy book
    if: >-
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

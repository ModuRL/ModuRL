name: Deploy versioned book

on:
  push:
    branches:
      - master
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    paths:
      - ".github/workflows/book-pages.yml"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  MDBOOK_VERSION: "0.5.4"
  MDBOOK_SHA256: "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7"

jobs:
  build:
    name: Build book
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Always build /dev from master. Full history supplies every release
          # tag used to reconstruct the immutable major/minor documentation.
          ref: master
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install mdBook
        shell: bash
        run: |
          archive="$RUNNER_TEMP/mdbook.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$archive" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "$MDBOOK_SHA256" "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/mdbook" --version

      - name: Build development and released books
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _site/dev
          mdbook build docs --dest-dir "$GITHUB_WORKSPACE/_site/dev"

          latest_series=""
          declare -A built_series=()
          series_order=()

          while IFS= read -r tag; do
            version="${tag#v}"
            IFS=. read -r major minor patch <<< "$version"
            series="$major.$minor"

            # The newest patch tag supplies the docs for each major/minor line.
            if [[ -n "${built_series[$series]+present}" ]]; then
              continue
            fi

            worktree="$RUNNER_TEMP/modurl-docs-$series"
            git worktree add --detach "$worktree" "$tag"

            if [[ ! -f "$worktree/docs/book.toml" ]]; then
              echo "Skipping $tag because it does not contain an mdBook"
              git worktree remove --force "$worktree"
              continue
            fi

            # Keep release content, but share master's theme and navigation.
            rm -rf "$worktree/docs/theme"
            cp -a docs/theme "$worktree/docs/theme"
            python3 - "$worktree/docs" "$series" <<'PY'
          import json
          import os
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          book_dir, series = sys.argv[1:]
          theme_config = tomllib.loads(Path("docs/book.toml").read_text())["output"]["html"]
          theme_keys = (
              "additional-css",
              "additional-js",
              "default-theme",
              "preferred-dark-theme",
          )
          build_env = os.environ.copy()
          book_config = tomllib.loads(Path("docs/book.toml").read_text())["book"]
          build_env["MDBOOK_BOOK__DESCRIPTION"] = json.dumps(book_config["description"])
          for key in theme_keys:
              if key in theme_config:
                  name = "MDBOOK_OUTPUT__HTML__" + key.upper().replace("-", "_")
                  build_env[name] = json.dumps(theme_config[key])
          build_env["MDBOOK_OUTPUT__HTML__SITE_URL"] = f"/{series}/"
          destination = Path(os.environ["GITHUB_WORKSPACE"]) / "_site" / series
          subprocess.run(
              ["mdbook", "build", book_dir, "--dest-dir", str(destination)],
              check=True,
              env=build_env,
          )
          PY
            git worktree remove --force "$worktree"

            built_series[$series]=1
            series_order+=("$series")
            if [[ -z "$latest_series" ]]; then
              latest_series="$series"
            fi
          done < <(
            git tag --list --sort=-version:refname |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true
          )

          cp docs/site/index.html _site/index.html
          cp docs/theme/favicon.ico _site/favicon.ico
          if [[ -z "$latest_series" ]]; then
            latest_series="dev"
          fi

          {
            printf '{"latest":"%s","versions":["dev"' "$latest_series"
            for series in "${series_order[@]}"; do
              printf ',"%s"' "$series"
            done
            printf ']}\n'
          } > _site/versions.json
          touch _site/.nojekyll
          printf '%s\n' 'docs.modurl.dev' > _site/CNAME

      - name: Generate search metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import quote

          root = Path("_site")
          base = "https://docs.modurl.dev"
          excluded = {"404.html", "print.html", "toc.html"}
          dev_pages = {
              path.relative_to(root / "dev").as_posix()
              for path in (root / "dev").rglob("*.html")
              if path.name not in excluded
          }
          for version in root.iterdir():
              if not version.is_dir():
                  continue
              for page in version.rglob("*.html"):
                  relative = page.relative_to(version).as_posix()
                  target = f"/dev/{quote(relative)}" if (root / "dev" / relative).is_file() else "/dev/"
                  canonical = f'<link rel="canonical" href="{base}{target}">'
                  html = page.read_text()
                  html = re.sub(
                      r'<link\b(?=[^>]*\brel=["\x27]canonical["\x27])[^>]*>\s*',
                      "", html, flags=re.IGNORECASE,
                  )
                  if "</head>" not in html:
                      raise ValueError(f"Missing head in {page}")
                  page.write_text(html.replace("</head>", f"    {canonical}\n</head>", 1))

          namespace = "http://www.sitemaps.org/schemas/sitemap/0.9"
          ET.register_namespace("", namespace)
          sitemap = ET.Element(f"{{{namespace}}}urlset")
          for relative in sorted(dev_pages):
              entry = ET.SubElement(sitemap, f"{{{namespace}}}url")
              ET.SubElement(entry, f"{{{namespace}}}loc").text = f"{base}/dev/{quote(relative)}"
          ET.indent(sitemap)
          ET.ElementTree(sitemap).write(root / "sitemap.xml", encoding="utf-8", xml_declaration=True)
          (root / "robots.txt").write_text(
              f"User-agent: *\nAllow: /\n\nSitemap: {base}/sitemap.xml\n"
          )
          print(f"Sitemap: {len(dev_pages)} development pages")
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy book
    if: >-
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
